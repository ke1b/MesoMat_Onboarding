[package]
name = "temp-humid-sensor"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-futures = { version = "0.1.2", path = "../embassy/embassy-futures" }
embassy-executor = { version = "0.10.0", path = "../embassy/embassy-executor", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", path = "../embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", path = "../embassy/embassy-sync", features = ["defmt"] }
embassy-nrf = { version = "0.10.0", path = "../embassy/embassy-nrf", features = ["defmt", "nrf54l15-app-s", "time-driver-grtc", "gpiote", "unstable-pac", "time"] }
embedded-io = { version = "0.7.0", features = ["defmt"]  }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

embedded-storage = "0.3.1"
portable-atomic = "1"
static_cell = "2"
[profile.release]
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/nrf54l15" }
]
